# Render Blueprint — deploys the AI Interviewer as two services:
#   1. ai-interviewer-server : Node web service (Express API)
#   2. ai-interviewer-client : static site (Vite build)
#
# To deploy: push this file to GitHub, then in Render click
# "New +" -> "Blueprint" and point it at this repo.
#
# After the first deploy, set the client's VITE_API_BASE_URL to the server's
# public URL (Render shows it once the server is live), then trigger a client
# redeploy so the value is baked into the build.
#
# Caveat: server/data/db.json (user profiles + practice history) lives on
# local disk, which Render's free web service does NOT persist across
# redeploys (only across restarts of the same running instance). Fine for a
# hackathon demo; for anything longer-lived, add a Render persistent disk
# mounted at server/data, or swap server/src/store.js for a real database.

services:
  # ---------------------------------------------------------------------
  # Backend API (Express)
  # ---------------------------------------------------------------------
  - type: web
    name: ai-interviewer-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # --- LLM primary: Magica (OpenAI-compatible). Set key in dashboard. ---
      # Browse models: https://inference.magica.com/v1/llm/models.json
      - key: MAGICA_API_KEY
        sync: false
      - key: MAGICA_BASE_URL
        value: https://inference.magica.com/v1
      - key: MAGICA_MODEL
        value: openai/gpt-4o-mini
      # --- LLM fallback: Groq (free). Used automatically if Magica fails. ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # --- Text-to-speech (Groq Orpheus, OpenAI-compatible). ---
      # Server TTS turns on when TTS_API_KEY or TTS_BASE_URL is set; otherwise
      # the client falls back to the browser voice. Set TTS_API_KEY in the
      # dashboard (or leave it unset to reuse GROQ_API_KEY).
      - key: TTS_API_KEY
        sync: false
      - key: TTS_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TTS_MODEL
        value: canopylabs/orpheus-v1-english
      # Valid Groq Orpheus voices: autumn diana hannah austin daniel troy
      - key: TTS_VOICE
        value: austin
      - key: TTS_FORMAT
        value: wav
      # --- Speech-to-text (optional). Leave unset for browser fallback. ---
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        value: https://api.openai.com/v1
      - key: STT_MODEL
        value: whisper-1
      # --- CORS: set to the client's URL to lock down, or leave unset (open). ---
      - key: CORS_ORIGIN
        sync: false
      # --- Google Sign-In (optional). Leave both unset for guest-only mode. ---
      # Must match VITE_GOOGLE_CLIENT_ID below exactly (server checks the
      # token's audience against this value).
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Signs our own session tokens. Set a fixed value so signed-in users
      # stay signed in across deploys/restarts (otherwise a random one is
      # generated at boot, which works but signs everyone out on restart).
      - key: JWT_SECRET
        sync: false

  # ---------------------------------------------------------------------
  # Frontend (Vite static site)
  # ---------------------------------------------------------------------
  - type: web
    name: ai-interviewer-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Point the built client at the deployed server. Fill in the server's
      # public URL after its first deploy, then redeploy the client.
      - key: VITE_API_BASE_URL
        sync: false
      # Must match GOOGLE_CLIENT_ID above exactly. Leave both unset to run
      # in guest-only mode (device-local history, no server-side profile).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # SPA fallback so client-side routing / refreshes resolve to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
